font=JetBrainsMono Nerd Font Mono:size=16
pad=8x8 center-when-maximized-and-fullscreen

[scrollback]
lines=10000

[colors-dark]
alpha=1.0
background=202020
foreground=c7c3a5
regular0=16161d
regular1=c34043
regular2=76946a
regular3=c0a36e
regular4=7e9cd8
regular5=957fb8
regular6=6a9589
regular7=c8c093
bright0=727169
bright1=e82424
bright2=98bb6c
bright3=e6c384
bright4=7fb4ca
bright5=938aa9
bright6=7aa89f
bright7=d7d3b5

[key-bindings]
unicode-input=none
# Foot starts before Bash adds ~/.local/bin to PATH.
pipe-scrollback=[sh -c 'exec "$HOME/.local/bin/nvim-scrollback-foot"'] Control+2

[text-bindings]
\x1b[9001~=Control+1
